[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-tui"
version = "0.1.0"
description = "Terminal weather forecast TUI powered by the Open-Meteo API (ECMWF IFS HRES, 9 km)"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "httpx>=0.27",
    "textual>=1.0,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
weather-tui = "weather_tui.__main__:main"

[tool.setuptools.packages.find]
include = ["weather_tui*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["weather_tui", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DTZ", "RUF", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["weather_tui"]
